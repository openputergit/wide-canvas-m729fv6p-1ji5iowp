<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Info Finder | India</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #f0f0f0;
            background-image: url("data:image/svg+xml,%3Csvg width='6' height='6' viewBox='0 0 6 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23000000' fill-opacity='0.1' fill-rule='evenodd'%3E%3Cpath d='M5 0h1L0 6V5zM6 5v1H5z'/%3E%3C/g%3E%3C/svg%3E");
        }
        .neu-brutal {
            border: 4px solid #000;
            box-shadow: 6px 6px 0 #000;
            transition: all 0.2s ease;
        }
        .neu-brutal:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 #000;
        }
        .neu-brutal:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }
        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8 min-h-screen">
        <div class="max-w-2xl mx-auto">
            <!-- Header -->
            <div class="text-center mb-12">
                <h1 class="text-4xl md:text-6xl font-bold mb-4">🚗 Vehicle Info Finder</h1>
                <p class="text-lg md:text-xl">Get your vehicle details instantly!</p>
            </div>

            <!-- Search Box -->
            <div class="neu-brutal bg-white p-8 mb-8">
                <form id="vehicleForm" class="space-y-6">
                    <div>
                        <label for="vehicleNumber" class="block text-lg font-bold mb-2">Enter Vehicle Number</label>
                        <input type="text" id="vehicleNumber" 
                               class="w-full p-4 text-lg border-4 border-black focus:outline-none uppercase"
                               placeholder="E.g., MH02AB1234"
                               maxlength="10"
                               required>
                    </div>
                    <button type="submit" 
                            class="neu-brutal w-full bg-yellow-300 p-4 text-xl font-bold hover:bg-yellow-400">
                        Find Details <i class="bi bi-search"></i>
                    </button>
                </form>
            </div>

            <!-- Result Box (Hidden by default) -->
            <div id="resultBox" class="neu-brutal bg-white p-8 hidden">
                <h2 class="text-2xl font-bold mb-4">Vehicle Details</h2>
                <div id="resultContent" class="space-y-4">
                    <!-- Results will be populated here -->
                </div>
            </div>

            <!-- Loading Indicator (Hidden by default) -->
            <div id="loadingIndicator" class="text-center hidden">
                <div class="neu-brutal inline-block bg-blue-300 p-4">
                    <i class="bi bi-gear-wide-connected animate-spin text-4xl"></i>
                    <p class="mt-2 font-bold">Fetching Details...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('vehicleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const vehicleNumber = document.getElementById('vehicleNumber').value.toUpperCase();
            const loadingIndicator = document.getElementById('loadingIndicator');
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');

            // Validate vehicle number format (basic validation)
            const vehicleRegex = /^[A-Z]{2}[0-9]{2}[A-Z]{1,2}[0-9]{4}$/;
            if (!vehicleRegex.test(vehicleNumber)) {
                alert('Please enter a valid vehicle number format (e.g., MH02AB1234)');
                return;
            }

            // Show loading, hide results
            loadingIndicator.classList.remove('hidden');
            resultBox.classList.add('hidden');

            try {
                // Simulate API call (replace with actual API endpoint)
                await new Promise(resolve => setTimeout(resolve, 2000));

                // Sample data (replace with actual API response)
                const vehicleData = {
                    registrationNumber: vehicleNumber,
                    registrationDate: "01-01-2020",
                    manufacturer: "Sample Manufacturer",
                    model: "Sample Model",
                    fuelType: "Petrol",
                    vehicleClass: "LMV",
                    insuranceValidUpto: "31-12-2023"
                };

                // Populate results
                resultContent.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <p class="font-bold">Registration Number:</p>
                            <p class="neu-brutal bg-green-200 p-2">${vehicleData.registrationNumber}</p>
                        </div>
                        <div class="space-y-2">
                            <p class="font-bold">Registration Date:</p>
                            <p class="neu-brutal bg-blue-200 p-2">${vehicleData.registrationDate}</p>
                        </div>
                        <div class="space-y-2">
                            <p class="font-bold">Manufacturer:</p>
                            <p class="neu-brutal bg-yellow-200 p-2">${vehicleData.manufacturer}</p>
                        </div>
                        <div class="space-y-2">
                            <p class="font-bold">Model:</p>
                            <p class="neu-brutal bg-pink-200 p-2">${vehicleData.model}</p>
                        </div>
                        <div class="space-y-2">
                            <p class="font-bold">Fuel Type:</p>
                            <p class="neu-brutal bg-purple-200 p-2">${vehicleData.fuelType}</p>
                        </div>
                        <div class="space-y-2">
                            <p class="font-bold">Vehicle Class:</p>
                            <p class="neu-brutal bg-orange-200 p-2">${vehicleData.vehicleClass}</p>
                        </div>
                    </div>
                `;

                // Show results, hide loading
                resultBox.classList.remove('hidden');
            } catch (error) {
                alert('Failed to fetch vehicle details. Please try again.');
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        });

        // Auto-format vehicle number while typing
        document.getElementById('vehicleNumber').addEventListener('input', (e) => {
            let value = e.target.value.toUpperCase();
            value = value.replace(/[^A-Z0-9]/g, ''); // Remove any non-alphanumeric characters
            e.target.value = value;
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
